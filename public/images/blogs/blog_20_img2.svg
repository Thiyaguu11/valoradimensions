<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
        </marker>
    </defs>

    <!-- Main Container Card -->
    <rect x="0" y="0" width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2" />

    <!-- Window top navigation bar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 784 0 A 16 16 0 0 1 800 16 L 800 50 L 0 50 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="25" cy="25" r="6" fill="#ef4444" opacity="0.6" />
    <circle cx="45" cy="25" r="6" fill="#f59e0b" opacity="0.6" />
    <circle cx="65" cy="25" r="6" fill="#10b981" opacity="0.6" />
    <text x="95" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#64748b">E-COMMERCE // STRATEGIC BLUEPRINT</text>

    <!-- Flowchart Title -->
    <text x="40" y="95" font-family="sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="-0.5">B2B E-COMMERCE SCALING: HOW MANUFACTURERS BUILD HIGH-VOLUME WHOLESALE ORDERING FUNNELS</text>
    <text x="40" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a855f7" letter-spacing="1">CONVERSION FLOW &amp; INTEGRATED SYSTEM ARCHITECTURE</text>

    <!-- Node Steps -->
    
            <!-- Node 1 -->
            <rect x="40" y="150" width="220" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
            <rect x="40" y="150" width="220" height="40" rx="12" fill="url(#primaryGrad)" />
            <rect x="40" y="180" width="220" height="10" fill="url(#primaryGrad)" />
            <text x="150" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">01 / BULK ORDER</text>
            <text x="150" y="220" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">PROCESS STEP</text>
            <foreignObject x="55" y="240" width="190" height="85">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: sans-serif; font-size: 10px; color: #64748b; line-height: 1.4; text-align: center;">
                    Wholesale client inputs bulk quantity checkout list in B2B portal.
                </div>
            </foreignObject>
        
                <!-- Arrow 1 to 2 -->
                <line x1="260" y1="245" x2="280" y2="245" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
            
            <!-- Node 2 -->
            <rect x="280" y="150" width="220" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
            <rect x="280" y="150" width="220" height="40" rx="12" fill="url(#primaryGrad)" />
            <rect x="280" y="180" width="220" height="10" fill="url(#primaryGrad)" />
            <text x="390" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">02 / CREDIT AUDIT</text>
            <text x="390" y="220" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">PROCESS STEP</text>
            <foreignObject x="295" y="240" width="190" height="85">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: sans-serif; font-size: 10px; color: #64748b; line-height: 1.4; text-align: center;">
                    API checks buyer credit limit and generates custom invoice terms.
                </div>
            </foreignObject>
        
                <!-- Arrow 2 to 3 -->
                <line x1="500" y1="245" x2="520" y2="245" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
            
            <!-- Node 3 -->
            <rect x="520" y="150" width="220" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
            <rect x="520" y="150" width="220" height="40" rx="12" fill="url(#primaryGrad)" />
            <rect x="520" y="180" width="220" height="10" fill="url(#primaryGrad)" />
            <text x="630" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">03 / LOGISTICS ENQUEUE</text>
            <text x="630" y="220" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">PROCESS STEP</text>
            <foreignObject x="535" y="240" width="190" height="85">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: sans-serif; font-size: 10px; color: #64748b; line-height: 1.4; text-align: center;">
                    Order details dispatched to warehouse queue for high-volume shipment.
                </div>
            </foreignObject>
        

    <!-- Bottom trust labels -->
    <rect x="40" y="375" width="714" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="60" y="401" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">VALORA DIMENSIONS ENGINE BLUEPRINT</text>
    <text x="734" y="401" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a855f7" text-anchor="end">100% REGULATORY SECURE PIPELINE</text>
</svg>